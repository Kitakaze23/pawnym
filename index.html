<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawnym — подбор клички для собаки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5EC; --surface:#FFFFFF; --surface-2:#F4EBDD; --ink:#2A1F17; --ink-2:#6B5B4E; --line:#E8DCCB;
  --accent:#D9573A; --accent-ink:#FFFFFF; --accent-soft:#FBE3DA; --sage:#6F8F72; --sage-soft:#E3ECDF;
  --gold:#C99A2E; --shadow:0 1px 2px rgba(42,31,23,.06),0 8px 24px -12px rgba(42,31,23,.18);
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1612; --surface:#26201A; --surface-2:#2F2821; --ink:#F6EDE2; --ink-2:#B8A796; --line:#3A3129;
  --accent:#F0795A; --accent-ink:#1B1612; --accent-soft:#3F2A22; --sage:#9DBB9F; --sage-soft:#26332A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:38px}
.brand b{font:900 26px/1 Nunito,sans-serif;letter-spacing:-.5px}
.brand small{display:block;color:var(--ink-2);font-size:12.5px;font-weight:500;margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .ico{font-size:16px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
@media (max-width:720px){
  .tabs{position:fixed;left:10px;right:10px;bottom:10px;z-index:20;justify-content:space-around;box-shadow:var(--shadow);background:var(--surface)}
  .tab{flex-direction:column;gap:1px;font-size:11px;padding:6px 8px;flex:1}
  .tab[aria-selected=true]{background:var(--accent-soft);box-shadow:none}
  .tab .ico{font-size:19px}
  .tab .badge{position:absolute;margin:-4px 0 0 22px}
  .brand small{display:none}
}
.view{display:none;padding:12px 0 24px}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{font:900 clamp(28px,5vw,44px)/1.05 Nunito,sans-serif;letter-spacing:-1px;margin:10px 0 6px}
.hero em{font-style:normal;color:var(--accent)}
.lead{color:var(--ink-2);margin:0 0 18px;max-width:560px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
@media (max-width:720px){.filters{grid-template-columns:1fr}}
.field label,.lbl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:6px}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
select,input[type=text]{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);padding:10px 12px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--accent);background:var(--surface)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pools-line{margin-top:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--ink)}
.chip.origin{background:var(--sage-soft);color:var(--sage)}
.chip.main{background:var(--accent-soft);color:var(--accent)}
.cta{border:0;background:var(--accent);color:var(--accent-ink);font:800 17px Nunito,sans-serif;padding:14px 22px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px -8px var(--accent);transition:transform .12s}
.cta:active{transform:scale(.97)}
.ghost{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.ghost:hover{border-color:var(--ink-2)}
.actions{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.card .name{font:900 28px/1.1 Nunito,sans-serif;letter-spacing:-.5px;word-break:break-word}
.card .short{font-size:13.5px;color:var(--ink-2)}
.card .short b{color:var(--ink);font-weight:700;background:var(--surface-2);padding:1px 8px;border-radius:999px}
.card .mean{font-size:13.5px;color:var(--ink-2);font-style:italic;min-height:1em}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.icons{display:flex;gap:2px}
.icon{border:0;background:transparent;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:grid;place-items:center;color:var(--ink-2)}
.icon:hover{background:var(--surface-2)}
.icon.liked{color:var(--accent)}
.icon svg{width:20px;height:20px}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty .big{font-size:44px}
.fav-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.fav{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fav .n{font:800 19px Nunito,sans-serif}
.fav .s{color:var(--ink-2);font-size:13px}
.fav .grow{flex:1;min-width:0}
.settings{display:grid;gap:14px}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px}
.set .t{font-weight:700}
.set .d{font-size:13px;color:var(--ink-2)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--sage)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.poolpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.poolpick button{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.poolpick button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.poolpick[aria-disabled=true]{opacity:.45;pointer-events:none}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px}
.stat b{display:block;font:900 22px Nunito,sans-serif}
.stat span{font-size:12px;color:var(--ink-2)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.sh-out{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sh-out button{border:0;background:var(--accent-soft);color:var(--accent);font:800 18px Nunito,sans-serif;padding:8px 14px;border-radius:12px;cursor:pointer}
.sh-out button.db{background:var(--sage-soft);color:var(--sage)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{color:var(--ink-2);font-size:12px;text-align:center;padding:10px 0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="var(--accent)"/><g fill="var(--accent-ink)"><ellipse cx="24" cy="30" rx="8.5" ry="7"/><ellipse cx="13.5" cy="21" rx="3.6" ry="4.6" transform="rotate(-18 13.5 21)"/><ellipse cx="20" cy="14.5" rx="3.6" ry="4.8"/><ellipse cx="28" cy="14.5" rx="3.6" ry="4.8"/><ellipse cx="34.5" cy="21" rx="3.6" ry="4.6" transform="rotate(18 34.5 21)"/></g></svg>
      <div><b>Pawnym</b><small data-t="tagline"></small></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="pick"><span class="ico">✨</span><span data-t="tabPick"></span></button>
      <button class="tab" role="tab" data-view="fav"><span class="ico">♥</span><span data-t="tabFav"></span><span class="badge" id="favCount" hidden></span></button>
      <button class="tab" role="tab" data-view="short"><span class="ico">✂️</span><span data-t="tabShort"></span></button>
      <button class="tab" role="tab" data-view="settings"><span class="ico">⚙️</span><span data-t="tabSettings"></span></button>
    </nav>
  </header>

  <!-- ПОДБОР -->
  <section class="view" id="view-pick">
    <h1 class="hero" data-t="hero" data-html></h1>
    <p class="lead" data-t="lead"></p>
    <div class="panel">
      <div class="filters">
        <div class="field"><span class="lbl" data-t="gender"></span>
          <div class="seg" id="segGender">
            <button data-v="any" data-t="any"></button><button data-v="m" data-t="male"></button><button data-v="f" data-t="female"></button>
          </div></div>
        <div class="field"><span class="lbl" data-t="size"></span>
          <div class="seg" id="segSize">
            <button data-v="any" data-t="any"></button><button data-v="s" data-t="small"></button><button data-v="m" data-t="medium"></button><button data-v="l" data-t="large"></button>
          </div></div>
        <div class="field"><label for="breed" data-t="breed"></label><select id="breed"></select></div>
        <div class="field"><label for="letter" data-t="letter"></label><input type="text" id="letter" maxlength="1" autocomplete="off"></div>
      </div>
      <div class="pools-line" id="poolsLine"></div>
      <div class="actions">
        <button class="cta" id="btnGen"><span>🐾</span><span data-t="generate"></span></button>
        <span class="hint" id="genHint"></span>
      </div>
    </div>
    <div class="grid" id="results" aria-live="polite"></div>
  </section>

  <!-- ИЗБРАННОЕ -->
  <section class="view" id="view-fav">
    <h1 class="hero" data-t="favTitle"></h1>
    <div class="row"><button class="ghost" id="btnCopyAll" data-t="copyAll"></button><button class="ghost" id="btnClearFav" data-t="clearFav"></button></div>
    <div class="fav-list" id="favList"></div>
  </section>

  <!-- СОКРАЩАЛКА -->
  <section class="view" id="view-short">
    <h1 class="hero" data-t="shortTitle"></h1>
    <p class="lead" data-t="shortLead"></p>
    <div class="panel">
      <label class="lbl" for="shortIn" data-t="fullName"></label>
      <input type="text" id="shortIn" autocomplete="off">
      <div class="sh-out" id="shortOut"></div>
    </div>
  </section>

  <!-- НАСТРОЙКИ -->
  <section class="view" id="view-settings">
    <h1 class="hero" data-t="tabSettings"></h1>
    <div class="panel settings">
      <div class="field"><label for="uiLang" data-t="uiLang"></label><select id="uiLang"></select></div>
      <div class="field"><label for="nameLang" data-t="nameLang"></label><select id="nameLang"></select>
        <div class="hint" data-t="nameLangHint" style="margin-top:6px"></div></div>
      <hr class="sep">
      <div class="set"><div><div class="t" data-t="exotic"></div><div class="d" data-t="exoticHint"></div></div>
        <label class="switch"><input type="checkbox" id="optExotic"><span></span></label></div>
      <div class="poolpick" id="poolPick"></div>
      <hr class="sep">
      <div class="set"><div><div class="t" data-t="origin"></div><div class="d" data-t="originHint"></div></div>
        <label class="switch"><input type="checkbox" id="optOrigin"><span></span></label></div>
      <div class="set"><div><div class="t" data-t="meanings"></div></div>
        <label class="switch"><input type="checkbox" id="optMean"><span></span></label></div>
      <hr class="sep">
      <div><span class="lbl" data-t="stats"></span>
        <div class="stats" id="stats"></div></div>
    </div>
  </section>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>

  set(k,v){try{localStorage.setItem('pawnym:'+k,JSON.stringify(v))}catch(e){}}

    line = line.trim(); if (!line) return;
    const [full, short, g, sz, mean] = line.split('|');
    const [mRu, mEn] = (mean || '').split('~');
    const n = {id: pool + ':' + i, pool, full, short: short || full, g: g || 'u', sz: sz || '', mRu: mRu || '', mEn: mEn || mRu || ''};
    NAMES.push(n); BY_POOL[pool].push(n);
  });
}
const POOLS = Object.keys(POOL_META);

// ---------- state ----------
const browserLangs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']).map(l => l.toLowerCase().split('-')[0]);
const ALIAS = {uk:'ru', be:'ru', kk:'ru', nb:'no', nn:'no', ca:'es', pt:'es'};
function detect(list){ for (const l of browserLangs){ const x = ALIAS[l] || l; if (list.includes(x)) return x; } return null; }

const S = Object.assign({
  uiLang:'auto', nameLang:'auto', exotic:false, exoticPools:[], origin:true, meanings:true,

  for (const sz of ['s','m','l']) {
    const list = BREEDS.map((b,i)=>[b,i]).filter(([b])=>b[2]===sz).sort((a,b)=>breedLabel(a[0]).localeCompare(breedLabel(b[0]), ui()));

function activePools(){
  const main = nameLang(); const res = [{p:main, w:3, kind:'main'}];
  const b = S.breed !== '' ? BREEDS[+S.breed] : null;
  if (b && S.origin && b[3] !== main) res.push({p:b[3], w:2, kind:'origin'});
  if (S.exotic) {
    let ex = S.exoticPools.filter(p=>p!==main); if (!ex.length) ex = POOLS.filter(p=>p!==main);
    ex.forEach(p => { if (!res.find(r=>r.p===p)) res.push({p, w: ex.length > 4 ? 0.35 : 1, kind:'exotic'}); });

  return res;
}

$('#letter').addEventListener('input', e => { S.letter = e.target.value.trim(); save(); });

// ---------- generator ----------
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function fits(n){
  if (S.gender !== 'any' && n.g !== 'u' && n.g !== S.gender) return false;
  if (S.size !== 'any' && n.sz && !n.sz.includes(S.size)) return false;
  if (S.letter) { const L = norm(S.letter); if (!norm(n.full).startsWith(L) && !norm(n.short).startsWith(L)) return false; }
  return true;
}
function generate(count){
  const ap = activePools();
  const cands = ap.map(a => ({...a, list: BY_POOL[a.p].filter(fits)})).filter(a => a.list.length);
  if (!cands.length) return [];
  // если всё показано — начинаем круг заново
  if (cands.every(a => a.list.every(n => seen.has(n.id)))) cands.forEach(a => a.list.forEach(n => seen.delete(n.id)));
  const out = []; let guard = 0;
  while (out.length < count && guard++ < 400) {
    const pool = cands.filter(a => a.list.some(n => !seen.has(n.id)));
    if (!pool.length) break;
    const total = pool.reduce((s,a)=>s+a.w,0); let r = Math.random()*total, pick = pool[0];
    for (const a of pool){ r -= a.w; if (r <= 0){ pick = a; break; } }
    const free = pick.list.filter(n => !seen.has(n.id));
    const n = free[Math.floor(Math.random()*free.length)];
    seen.add(n.id); out.push(n);
  }
  return out;
}
function renderEmptyPick(){ $('#results').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">🐕</div>${esc(t('emptyPick'))}</div>`; }

const IC = {
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5c-2.2 4.6-9.2 9-9.2 9z"/></svg>',
  heartF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5c-2.2 4.6-9.2 9-9.2 9z"/></svg>',
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>'
};
const isFav = id => favs.some(f => f.id === id);
const meaning = n => ui()==='ru' ? n.mRu : n.mEn;
const genderIcon = g => g==='m' ? '♂' : g==='f' ? '♀' : '⚥';

function renderCards(list, animate=true){
  const box = $('#results');
  if (!list.length) { box.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">🤔</div>${esc(t('noResults'))}</div>`; return; }
  box.innerHTML = list.map((n,i) => `
    <article class="card" style="${animate?`animation-delay:${i*45}ms`:'animation:none'}">
      <div class="name">${esc(n.full)}</div>
      <div class="short">${n.short!==n.full ? `${esc(t('short'))}: <b>${esc(n.short)}</b>` : '&nbsp;'}</div>
      ${S.meanings ? `<div class="mean">${esc(meaning(n))}</div>` : ''}
      <div class="foot">
        <div class="tags"><span class="chip">${POOL_META[n.pool].flag} ${POOL_META[n.pool].label}</span><span class="chip" title="${n.g}">${genderIcon(n.g)}</span></div>
        <div class="icons">
          <button class="icon" data-act="speak" data-id="${n.id}" aria-label="${esc(t('listen'))}" title="${esc(t('listen'))}">${IC.speak}</button>
          <button class="icon" data-act="copy" data-id="${n.id}" aria-label="${esc(t('copy'))}" title="${esc(t('copy'))}">${IC.copy}</button>
          <button class="icon ${isFav(n.id)?'liked':''}" data-act="like" data-id="${n.id}" aria-pressed="${isFav(n.id)}" aria-label="${esc(t('like'))}" title="${esc(t('like'))}">${isFav(n.id)?IC.heartF:IC.heart}</button>
        </div>
      </div>
    </article>`).join('');
}
$('#btnGen').addEventListener('click', () => {
  lastBatch = generate(6); stats.gen += lastBatch.length; store.set('stats', stats);
  renderCards(lastBatch); renderStats();
  $('#btnGen').querySelector('[data-t]').textContent = t('more'); $('#genHint').textContent = '';
  track('names_generated', {count:lastBatch.length, gender:S.gender, size:S.size, breed:S.breed, lang:nameLang(), exotic:S.exotic});
});

// ---------- actions ----------
const byId = id => NAMES.find(n => n.id === id);
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('on'), 1600); }
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy')}catch(_){} ta.remove(); }
  toast(t('copied') + ' ✓');
}
function speak(n){
  try {
    const u = new SpeechSynthesisUtterance(n.short !== n.full ? `${n.full}. ${n.short}!` : n.full);
    u.lang = POOL_META[n.pool].speech; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u);
    stats.listen++; store.set('stats', stats); track('name_pronounced', {id:n.id});
  } catch(e){}
}
function toggleFav(n){
  if (isFav(n.id)) { favs = favs.filter(f => f.id !== n.id); track('name_unliked', {id:n.id}); }
  else { favs.unshift({id:n.id, ts:Date.now()}); stats.like++; track('name_liked', {id:n.id, pool:n.pool}); }
  store.set('favs', favs); store.set('stats', stats); renderStats(); renderFavs();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const n = byId(b.dataset.id); if (!n) return;
  if (b.dataset.act === 'like') { toggleFav(n); const on = isFav(n.id); b.classList.toggle('liked', on); b.setAttribute('aria-pressed', on); b.innerHTML = on ? IC.heartF : IC.heart; }
  if (b.dataset.act === 'copy') { copyText(n.short !== n.full ? `${n.full} (${n.short})` : n.full); stats.copy++; store.set('stats', stats); renderStats(); track('name_copied', {id:n.id}); }
  if (b.dataset.act === 'speak') speak(n);
});

// ---------- favorites ----------
function renderFavs(){
  const list = favs.map(f => byId(f.id)).filter(Boolean);
  $('#favList').innerHTML = list.length ? list.map(n => `
    <div class="fav"><span style="font-size:22px">${POOL_META[n.pool].flag}</span>
      <div class="grow"><div class="n">${esc(n.full)}</div><div class="s">${n.short!==n.full?esc(t('short'))+': '+esc(n.short)+' · ':''}${esc(meaning(n))}</div></div>
      <button class="icon" data-act="speak" data-id="${n.id}" aria-label="${esc(t('listen'))}">${IC.speak}</button>
      <button class="icon liked" data-act="like" data-id="${n.id}" aria-label="${esc(t('remove'))}">${IC.heartF}</button>
    </div>`).join('') : `<div class="empty"><div class="big">♡</div>${esc(t('emptyFav'))}</div>`;
  $('#btnCopyAll').disabled = $('#btnClearFav').disabled = !list.length;
}
$('#btnCopyAll').addEventListener('click', () => { const list = favs.map(f=>byId(f.id)).filter(Boolean); copyText(list.map(n => n.short!==n.full ? `${n.full} (${n.short})` : n.full).join('\n')); track('favorites_shared', {count:list.length}); });
$('#btnClearFav').addEventListener('click', () => { favs = []; store.set('favs', favs); renderFavs(); renderStats(); if (lastBatch.length) renderCards(lastBatch, false); });

// ---------- shortener ----------
const VOW = 'аеёиоуыэюяaeiouyäöüéèêëàâîïôûœæøåıáíóúāēīōū';
function shortForms(name){
  const s = name.trim(); if (s.length < 3) return [];
  const cyr = /[а-яё]/i.test(s); const low = s.toLowerCase();
  const isV = ch => VOW.includes(ch);
  let i = [...low].findIndex(isV); if (i < 0) i = 0;
  let stem = s.slice(0, i+1);
  if (low[i+1] && !isV(low[i+1])) stem = s.slice(0, i+2);
  // хвост: последний слог (согласная + гласная + …)
  let j = low.length - 1; while (j > 0 && !isV(low[j])) j--; const k = (j > 1 && !isV(low[j-1])) ? j-1 : j;
  const tail = k > i+1 ? s.slice(k) : ''; const Tail = tail ? tail[0].toUpperCase() + tail.slice(1).toLowerCase() : '';
  const stemL = stem.toLowerCase(); const St = stem[0].toUpperCase() + stemL.slice(1);
  const endsV = isV(stemL[stemL.length-1]);
  const out = cyr
    ? [St+'и', St+'ик', St+'ся', St+(endsV?'ша':'уша'), St+'а', Tail && Tail.length>2 ? Tail+'ик' : '']
    : [St+'y', St+'ie', St+'o', St+'s', St+'ster', Tail && Tail.length>2 ? Tail+'y' : ''];
  return [...new Set(out.filter(x => x && norm(x) !== norm(s) && x.length >= 2))].slice(0, 7);
}
function renderShort(){
  const v = $('#shortIn').value.trim(); const box = $('#shortOut');
  if (!v) { box.innerHTML = ''; return; }
  const hit = NAMES.filter(n => norm(n.full) === norm(v) && n.short !== n.full).map(n => n.short);
  const forms = [...new Set([...hit, ...shortForms(v)])];
  box.innerHTML = forms.map(f => `<button class="${hit.includes(f)?'db':''}" data-copy="${esc(f)}" title="${hit.includes(f)?esc(t('fromDb')):esc(t('copy'))}">${esc(f)}</button>`).join('');
}
$('#shortIn').addEventListener('input', renderShort);
$('#shortIn').addEventListener('change', () => track('shortener_used', {}));
$('#shortOut').addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy); });

// ---------- settings ----------
$('#uiLang').addEventListener('change', e => { S.uiLang = e.target.value; save(); lastBatch = []; seen.clear(); applyI18n(); track('settings_changed', {uiLang:S.uiLang}); });
$('#nameLang').addEventListener('change', e => { S.nameLang = e.target.value; save(); seen.clear(); renderLangSelects(); renderPoolPick(); renderPoolsLine(); track('settings_changed', {nameLang:S.nameLang}); });
$('#optExotic').addEventListener('change', e => { S.exotic = e.target.checked; save(); renderPoolPick(); renderPoolsLine(); track('settings_changed', {exotic:S.exotic}); });
$('#optOrigin').addEventListener('change', e => { S.origin = e.target.checked; save(); renderPoolsLine(); });
$('#optMean').addEventListener('change', e => { S.meanings = e.target.checked; save(); if (lastBatch.length) renderCards(lastBatch, false); });
$('#poolPick').addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if (!b) return; const p = b.dataset.p;
  S.exoticPools = S.exoticPools.includes(p) ? S.exoticPools.filter(x=>x!==p) : [...S.exoticPools, p];
  save(); b.setAttribute('aria-pressed', S.exoticPools.includes(p)); renderPoolsLine();
});

// ---------- tabs ----------
function show(view){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
  store.set('tab', view); window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { show(b.dataset.view); track('tab_opened', {tab:b.dataset.view}); }));

// ---------- boot ----------
applyI18n();
show(store.get('tab', 'pick'));
const first = !store.get('seenBefore', false);
track(first ? 'first_open' : 'app_open', {ui:ui(), nameLang:nameLang()}); store.set('seenBefore', true);
})();

</script>
</body>
